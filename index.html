<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayStation Hub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    .card {
      background: #1f2937;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .card h2 {
      margin-top: 0;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin: 12px 0;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      background: #2563eb;
      color: white;
    }

    button:active {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎮 PlayStation Hub</h1>

    <div class="subtitle">
      Подписки и подарочные карты
    </div>

    <div class="card">
      <h2>🎮 PlayStation Plus</h2>
      <p>Подписка PlayStation Plus</p>

      <div class="price">
        от 800 ₽
      </div>

      <button onclick="buy('PlayStation Plus')">
        Купить
      </button>
    </div>

    <div class="card">
      <h2>🎁 PS Store Gift Card</h2>
      <p>Подарочная карта PlayStation Store</p>

      <div class="price">
        от 85 ₽
      </div>

      <button onclick="buy('PS Store Gift Card')">
        Купить
      </button>
    </div>

  </div>

  <script>
    function buy(product) {
      alert('Вы выбрали: ' + product);
    }
  </script>

</body>
</html>
